# ===== Equiflow Backend Configuration =====

# Server
server.port=8080

# --- H2 in-memory database (good for local dev / demo) ---
spring.datasource.url=jdbc:h2:mem:equiflow;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- To switch to MySQL instead, comment out the H2 block above and use: ---
# spring.datasource.url=jdbc:mysql://localhost:3306/equiflow?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Logging
logging.level.org.springframework=INFO
logging.level.com.equiflow=DEBUG
